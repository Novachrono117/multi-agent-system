[project]
name = "job-fit-agents"
version = "0.1.0"
description = "Multi-agent decision-support pipeline for job applications: plans, uses real tools, and drafts a reviewable role brief. It never submits an application."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "Vinicius Gomes" }]
keywords = ["llm", "agents", "tool-use", "function-calling", "langgraph", "anthropic", "mcp"]

dependencies = [
    "anthropic>=0.69",
    "httpx>=0.27",
    "langgraph>=0.2.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
]

[project.scripts]
jobfit = "jobfit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfit"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "live: hits a real network service; excluded from CI and from the default run",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
